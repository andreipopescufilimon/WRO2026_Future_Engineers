<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
<rect width="1440" height="700" fill="#f6f9fc"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="29" fill="#19354a" font-weight="bold">V4.1 power distribution and major electrical loads</text>
<text x="60" y="98" font-family="Arial,sans-serif" font-size="16" fill="#526b7f">Functional power architecture. Consult the fabricated PCB revision for exact conductor routing and local 3.3 V regulation.</text>
