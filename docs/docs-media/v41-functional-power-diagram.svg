<text x="188" y="343" fill="#dcf4ff" font-family="Arial" font-size="21" text-anchor="middle">7.6 V / 300 mAh</text><text x="188" y="373" fill="#dcf4ff" font-family="Arial" font-size="16" text-anchor="middle">2.28 Wh nominal</text>
<path d="M320 333 L407 333 L407 211 L465 211" stroke="#567086" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
